name: Promote Staging to Main on Success
on:
  push:
    branches: [staging]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # --- First, run your tests ---
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9  # or your preferred pnpm version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20  # match your project's Node version
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run validation (types, lint, build)
        run: pnpm run validate

  # --- Then, merge to main if tests passed ---
  merge-to-main:
    needs: run-tests # This job waits for 'run-tests' to succeed
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Merge staging into main
        run: |
          git fetch origin
          git checkout main
          git merge --no-ff origin/staging -m "Auto-merge: Promote staging to main after successful tests"
          git push origin main

