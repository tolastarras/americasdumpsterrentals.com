name: PR Lighthouse Check

on:
  deployment_status:

jobs:
  lighthouse:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Preview'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Check if preview URL is reachable
        run: |
          curl -v -I --fail ${{ github.event.deployment_status.target_url }}

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run Lighthouse CI
        id: lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: ${{ github.event.deployment_status.target_url }}
          temporaryPublicStorage: true
          uploadArtifacts: false
          configPath: '.lighthouserc.js'   # 👈 points to your config file

      - name: Display and comment Lighthouse results
        uses: actions/github-script@v8
        env:
          LINKS: ${{ steps.lighthouse.outputs.links }}
        with:
          script: |
            const links = JSON.parse(process.env.LINKS);
            const summary = ['## Lighthouse Audit Results'];
            for (const [url, reportUrl] of Object.entries(links)) {
              summary.push(`- [${url}](${reportUrl})`);
            }
            const summaryText = summary.join('\n');

            // Write to job summary
            core.summary.addRaw(summaryText).write();

            // Post comment on PR if PR number is available
            const prNumber = context.payload.deployment_status?.deployment?.payload?.pull_request?.number;
            if (prNumber) {
              github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: summaryText
              });
            } else {
              core.info('No PR number found, skipping comment');
            }
